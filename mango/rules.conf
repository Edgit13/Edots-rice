# MangoWM window rules

# suppress maximize events explicitly
window_rule=ignore_maximize:1,app_id:.*

# "ghostty-opacity" (forced 0.90 opacity, GTK alpha-channel bug workaround)
window_rule=focused_opacity:0.90,unfocused_opacity:0.90,app_id:com.mitchellh.ghostty

# "fix-xwayland-drags" and "move-hyprland-run" were Hyprland/XWayland-internals-
# specific (empty-class-and-title matching, hyprland-run tool) — no mango
# equivalent, dropped.
