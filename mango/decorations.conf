# MangoWM decoration settings
blur=1
blur_params_num_passes=1
blur_params_radius=3
shadows=1
shadows_size=4
shadowscolor=
# decorations.lua's rounding=31 loaded after animations.lua's rounding=10 in
# the original require() order, so 30 is the value that actually applied.
border_radius=40
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
# dwindle.preserve_split=true, master.new_status=master
dwindle_preserve_split=1
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle
# general.gaps_in=5, gaps_out=20, border_size=2
gappih=5
gappiv=5
gappoh=20
gappov=20
borderpx=3
# active_border was a gradient rgba(33ccffee)->rgba(00ff99ee); mango has no
# gradient border, using the first stop. inactive_border = чорний, легкий
# blur (num_passes=1, radius=3 — уже мінімальні значення) навмисно лишені
# малими, щоб крізь напівпрозорі вікна проступала сама шпалера, а не
# розмита сірість.
focuscolor=0x000000aa
bordercolor=0x000000aa
# misc / UX
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1
