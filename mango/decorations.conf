# MangoWM decoration settings
blur=1
blur_params_num_passes=1
blur_params_radius=3
shadows=1
shadows_size=4
# Updated to support shadows_color natively in MangoWC 0.18.0+
shadows_color=0x00000088

border_radius=40
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dwindle_preserve_split=1
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# tag_rule (розкладка вікон) тут більше НЕ задається — його пише Settings → Вікна у layout.conf

gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=20
gap_outer_vertical=20
border_px=2

focus_color=0x000000aa
border_color=0x000000aa

# misc / UX
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1
