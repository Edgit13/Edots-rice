# MangoWM key bindings
#
# Programs:
#   terminal=ghostty  fileManager=dolphin  browser=firefox
#   screen_rec=wf-recorder  reboot=reboot
#   capture=QuickSnip (Quickshell)  lock=M3 lock screen (Quickshell)

bind=SUPER,r,reload_config

bind=SUPER,Return,spawn,ghostty
bind=SUPER,Q,killclient
bind=SUPER,U,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call screentool toggle'
bind=NONE,Print,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call screentool toggle'
bind=SUPER,F3,spawn,bash ~/.config/quickshell/bar/lockscreen/suspend.sh
bind=SUPER,END,spawn,reboot
bind=SUPER,L,spawn,bash ~/.config/quickshell/bar/lockscreen/lock.sh
bind=SUPER+SHIFT,V,spawn_shell,cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind=SUPER+SHIFT,U,spawn,~/.config/mango/scripts/lens.sh

# notifications (власний демон Quickshell; swaync більше не потрібен)
bind=SUPER,N,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call notifications toggle'
bind=SUPER+SHIFT,N,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call notifications clear'
bind=SUPER+CTRL,N,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call notifications dnd'

# Bar IPC
bind=SUPER,Space,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call pill toggleLauncher || qs -d -p ~/.config/quickshell/bar/shell.qml'
bind=SUPER,C,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call pill toggleWallpaper'
bind=SUPER,A,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call settingsapp toggle'
bind=SUPER,D,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call dashboard toggle'
bind=SUPER,T,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call tasks toggle'
bind=SUPER,V,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call pill toggleClipboard'
bind=SUPER,W,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call pill toggleWifi'
bind=SUPER,X,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call pill toggleMixer'
bind=SUPER,P,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call pill toggleMedia'
bind=SUPER,O,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call pill togglePower'
bind=SUPER,slash,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call pill toggleBinds'
bind=SUPER,Escape,spawn,sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call pill close; qs -p ~/.config/quickshell/bar/shell.qml ipc call notifications close; qs -p ~/.config/quickshell/bar/shell.qml ipc call dashboard close'

# custom edots apps
bind=SUPER+SHIFT,B,spawn,~/edots/edot-browser/build/edot-browser
bind=SUPER+SHIFT,D,spawn,~/.config/quickshell/dock/toggle-dock.sh

bind=SUPER,B,spawn,firefox
bind=SUPER,E,spawn,nautilus
bind=SUPER,F,togglefloating

bind=SUPER,M,spawn,mango msg quit

bind=SUPER,F1,spawn,bash ~/.config/quickshell/scripts/gamemode.sh toggle
bind=SUPER,J,dwindle_toggle_split_direction
bind=SUPER,Tab,switch_layout

# focus movement
bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# dwindle layout (manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# tag switch / move window to tag
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# scratchpad
bind=SUPER,S,toggle_scratchpad
bind=SUPER+SHIFT,S,minimized

# scroll through tags
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

# move/resize with mod+drag
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# media / brightness keys (bindl = works while screen locked)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioStop,spawn,playerctl stop

# OSD (гучність / яскравість) спрацьовує сам на будь-яку зміну — бінди вище лишаються як є.
# Якщо захочеш крок 5% через shell, заміни spawn-команди на:
#   sh -lc 'qs -p ~/.config/quickshell/bar/shell.qml ipc call osd volumeUp'   (volumeDown, volumeMute, brightnessUp, brightnessDown)
