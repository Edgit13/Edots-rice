# MangoWM layout settings

# swaync-control-center slide-in from top
layerrule=animation_type_open:slide,animation_type_close:slide,layer_name:swaync

# edots-bar: власні тінь/скруглення в Quickshell (ElevationShadow), тому
# компоузитор-бордер/тінь навколо layer-surface вимкнено
layerrule=layer_name:edots-bar,no_render_border:1,noshadow:1
