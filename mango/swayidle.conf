# MangoWM swayidle configuration

lock_cmd = swaylock -f -c 000000
before_sleep_cmd = swaylock -f -c 000000
after_resume_cmd = mctl dpms on

# Lock after 5 minutes
 timeout 300 'swaylock -f -c 000000'

# Turn displays off after 10 minutes, restore on resume
 timeout 600 'mctl dpms off' resume 'mctl dpms on'

# Optional media pause hook could go here later
