# MangoWM autostart modules

exec_once=~/.config/quickshell/bar/reload.sh
exec_once=awww-daemon
exec_once=wl-paste --type text/plain --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=swayidle -w -C ~/.config/mango/swayidle.conf
exec_once=swaync
exec_once=blueman-applet
exec_once=nm-applet --indicator
exec_once=~/edots/run.sh
exec_once=python3 ~/edots/tui-player/forks/player.py -d
