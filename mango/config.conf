# ~/.config/mango/config.conf
# Split into modules/*.conf for a modular MangoWM setup.
# Wiki: https://github.com/DreamMaoMao/mango/wiki/

# Enable auto-reload on configuration save (New in 0.18.0)
auto_reload_config=1

source=~/.config/mango/env.conf
source=~/.config/mango/monitors.conf
source=~/.config/mango/autostart.conf
source=~/.config/mango/input.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/decorations.conf
source=~/.config/mango/animations.conf
source=~/.config/mango/binds.conf
# останнім: tag_rule / circle_layout із Settings → Вікна мають перекривати все інше
source=~/.config/mango/layout.conf

blur_layer=1
blur_params_radius=9
blur_params_num_passes=2
